<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sealed Results Study</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: #eef2f7; color: #1f2937; min-height: 100vh; padding: 32px 16px; line-height: 1.6;
}
.card {
  max-width: 700px; margin: 0 auto; background: #fff; border-radius: 24px;
  padding: 52px; box-shadow: 0 8px 40px rgba(15,23,42,0.09);
}
@media (max-width: 600px) { .card { padding: 32px 20px; } }

h1 { font-size: 32px; font-weight: 800; color: #111827; letter-spacing: -0.5px; margin-bottom: 6px; }
h2 { font-size: 24px; font-weight: 700; color: #111827; letter-spacing: -0.3px; margin-bottom: 18px; }
h3 { font-size: 12px; font-weight: 700; color: #6b7280; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.7px; }
p  { font-size: 15.5px; color: #4b5563; margin-bottom: 14px; }
strong { color: #111827; }

.progress-wrap { margin-bottom: 36px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 13px; color: #9ca3af; font-weight: 500; margin-bottom: 8px; }
.progress-track { background: #e5e7eb; border-radius: 99px; height: 6px; overflow: hidden; }
.progress-fill  { background: linear-gradient(90deg,#3b82f6,#6366f1); height: 100%; border-radius: 99px; transition: width .4s ease; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 13px 26px; border-radius: 12px; border: none;
  font-size: 15px; font-weight: 600; cursor: pointer; transition: all .15s ease;
}
.btn-primary   { background: #2563eb; color: #fff; }
.btn-primary:hover  { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 6px 18px rgba(37,99,235,.28); }
.btn-primary:active { transform: translateY(0); }
.btn-secondary { background: #f3f4f6; color: #374151; border: 1.5px solid #e5e7eb; }
.btn-secondary:hover { background: #e9ecf0; }
.btn-row { display: flex; gap: 12px; margin-top: 32px; align-items: center; flex-wrap: wrap; }

.choice-btn {
  display: block; width: 100%; padding: 20px 24px; border: 2.5px solid #e5e7eb;
  border-radius: 16px; background: #fff; cursor: pointer; text-align: left;
  transition: all .15s ease; margin-bottom: 14px;
}
.choice-btn:hover    { border-color: #3b82f6; background: #f0f6ff; }
.choice-btn.selected { border-color: #2563eb; background: #eff6ff; }
.choice-btn .c-title { font-weight: 700; font-size: 16px; color: #111827; margin-bottom: 5px; }
.choice-btn .c-desc  { font-size: 14px; color: #6b7280; line-height: 1.55; }
.choice-btn .c-cost  {
  display: inline-flex; align-items: center; gap: 5px; margin-top: 8px;
  font-size: 12.5px; font-weight: 600; color: #d97706;
  background: #fef3c7; padding: 3px 10px; border-radius: 99px;
}

.infobox { border-radius: 14px; padding: 18px 22px; margin: 20px 0; font-size: 15px; line-height: 1.65; border-left: 4px solid; }
.ib-blue   { background: #eff6ff; border-color: #3b82f6; }
.ib-amber  { background: #fffbeb; border-color: #f59e0b; }
.ib-green  { background: #f0fdf4; border-color: #22c55e; }
.ib-red    { background: #fef2f2; border-color: #ef4444; }
.ib-gray   { background: #f9fafb; border-color: #9ca3af; }
.ib-purple { background: #f5f3ff; border-color: #7c3aed; }

.coins-row {
  display: flex; align-items: center; gap: 14px; padding: 18px 22px;
  background: #fefce8; border-radius: 14px; border: 1.5px solid #fde68a; margin-bottom: 22px;
}
.coins-icon  { font-size: 30px; }
.coins-label { font-weight: 700; font-size: 18px; color: #92400e; }
.coins-sub   { font-size: 13px; color: #a16207; margin-top: 2px; }

.risk-box { background: #f9fafb; border-radius: 18px; padding: 26px 28px; margin: 24px 0; border: 1.5px solid #e5e7eb; }
.risk-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
.risk-label-text { font-size: 13px; font-weight: 700; color: #6b7280; text-transform: uppercase; letter-spacing: 0.5px; }
.risk-sublabel   { font-size: 13px; color: #9ca3af; margin-top: 3px; }
.risk-pct  { font-size: 44px; font-weight: 900; line-height: 1; }
.risk-bar  { background: #e5e7eb; height: 18px; border-radius: 9px; overflow: hidden; margin-bottom: 12px; }
.risk-fill { height: 100%; border-radius: 9px; transition: width .7s cubic-bezier(.4,0,.2,1); }
.risk-legend { display: flex; justify-content: space-between; font-size: 13px; color: #6b7280; flex-wrap: wrap; gap: 4px; }
.risk-legend span { display: flex; align-items: center; gap: 6px; }
.risk-dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }

/* Countdown */
.countdown-wrap { text-align: center; padding: 40px 20px; }
.countdown-circle {
  width: 140px; height: 140px; border-radius: 50%; border: 8px solid #e5e7eb;
  margin: 0 auto 20px; display: flex; align-items: center; justify-content: center;
  position: relative; font-size: 42px; font-weight: 900; color: #2563eb;
}
.countdown-ring { position: absolute; top: -8px; left: -8px; width: 140px; height: 140px; border-radius: 50%; transform: rotate(-90deg); }
.countdown-ring-fill { fill: none; stroke: #2563eb; stroke-width: 8; stroke-dasharray: 339; stroke-dashoffset: 0; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
.countdown-label { font-size: 18px; font-weight: 600; color: #374151; margin-bottom: 8px; }
.countdown-sub   { font-size: 14px; color: #9ca3af; }

/* Likert */
.likert-group { margin-bottom: 30px; }
.likert-q { font-weight: 600; font-size: 15px; color: #1f2937; margin-bottom: 14px; line-height: 1.55; }
.likert-scale { display: grid; grid-template-columns: repeat(7,1fr); gap: 6px; }
.likert-scale input[type="radio"] { display: none; }
.likert-scale label {
  display: flex; align-items: center; justify-content: center; padding: 11px 4px;
  border: 2px solid #e5e7eb; border-radius: 10px; cursor: pointer;
  font-size: 14px; font-weight: 600; color: #9ca3af; transition: all .12s ease; user-select: none;
}
.likert-scale input[type="radio"]:checked + label { background: #2563eb; border-color: #2563eb; color: #fff; }
.likert-scale label:hover { border-color: #93c5fd; color: #2563eb; }
.likert-ends { display: flex; justify-content: space-between; font-size: 12px; color: #9ca3af; margin-top: 6px; padding: 0 2px; }

/* Comprehension */
.comp-item { margin-bottom: 28px; }
.comp-q    { font-weight: 600; font-size: 15px; color: #1f2937; margin-bottom: 12px; }
.radio-option {
  display: flex; align-items: flex-start; gap: 12px; padding: 13px 16px;
  border: 2px solid #e5e7eb; border-radius: 12px; cursor: pointer;
  margin-bottom: 9px; transition: all .12s ease; font-size: 15px;
}
.radio-option:hover      { border-color: #93c5fd; }
.radio-option.is-correct { border-color: #22c55e; background: #f0fdf4; }
.radio-option.is-wrong   { border-color: #ef4444; background: #fef2f2; }
.radio-option input      { margin-top: 3px; flex-shrink: 0; accent-color: #2563eb; }

/* Demographics form */
.form-group { margin-bottom: 22px; }
.form-label { display: block; font-weight: 600; font-size: 14px; color: #374151; margin-bottom: 6px; }
.form-label .optional { font-weight: 400; color: #9ca3af; font-size: 13px; margin-left: 4px; }
.form-input {
  width: 100%; padding: 12px 16px; border: 2px solid #e5e7eb; border-radius: 10px;
  font-size: 15px; color: #1f2937; outline: none; transition: border-color .15s;
  background: #fff;
}
.form-input:focus { border-color: #3b82f6; }
.form-input[readonly] { background: #f9fafb; color: #6b7280; }
.form-hint { font-size: 12.5px; color: #9ca3af; margin-top: 5px; }

/* Condition badge */
.cond-badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px;
  border-radius: 99px; font-size: 13px; font-weight: 700; letter-spacing: 0.3px;
}
.cond-none { background: #fef3c7; color: #92400e; }
.cond-low  { background: #fee2e2; color: #991b1b; }
.cond-high { background: #d1fae5; color: #065f46; }

/* Summary table */
.summary-table { width: 100%; border-collapse: collapse; font-size: 14.5px; margin: 20px 0; }
.summary-table th { background: #f3f4f6; padding: 10px 14px; text-align: left; font-weight: 600; color: #374151; border-bottom: 2px solid #e5e7eb; }
.summary-table td { padding: 11px 14px; border-bottom: 1px solid #f3f4f6; vertical-align: middle; }
.summary-table tr:last-child td { border-bottom: none; }
.badge     { display: inline-block; padding: 3px 11px; border-radius: 99px; font-size: 12px; font-weight: 700; }
.badge-yes { background: #dcfce7; color: #166534; }
.badge-no  { background: #fee2e2; color: #991b1b; }

/* Save status */
.save-status { display: flex; align-items: center; gap: 8px; font-size: 14px; padding: 10px 0; }
.save-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.save-dot.saving  { background: #f59e0b; animation: pulse 1s infinite; }
.save-dot.saved   { background: #22c55e; }
.save-dot.failed  { background: #ef4444; }
@keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.4; } }

.divider  { border: none; border-top: 1px solid #e5e7eb; margin: 28px 0; }
.text-sm  { font-size: 13px; color: #9ca3af; }
.mt-16 { margin-top: 16px; }
.mt-24 { margin-top: 24px; }
.error-msg { color: #dc2626; font-size: 13.5px; margin-top: 10px; font-weight: 500; }
.hidden { display: none !important; }
.step-pill {
  display: inline-block; background: #eff6ff; color: #2563eb;
  font-size: 12px; font-weight: 700; padding: 4px 12px; border-radius: 99px;
  letter-spacing: 0.4px; margin-bottom: 14px; text-transform: uppercase;
}

/* Round block in Likert end screen */
.round-block {
  border-top: 1px solid #e5e7eb; padding-top: 28px; margin-top: 28px;
}
.round-block:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.round-header {
  background: #f9fafb; border-radius: 12px; padding: 14px 18px; margin-bottom: 22px;
  font-size: 14px; color: #374151;
}
.round-header strong { color: #111827; }
</style>
<!-- Firebase SDK (compat v10 &#8212; works without ES modules) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<div id="root"></div>

<script>
// ===============================================================
//  \u{2605} RESEARCHER SETTINGS \u{2014} edit before deploying \u{2605}
// ===============================================================
const RESEARCHER = {
  // Google Sheets auto-backup.
  // 1. Create a Google Apps Script web app (see google_apps_script.js for code).
  // 2. Deploy it and paste the web app URL here.
  // Leave blank ('') to disable \u{2014} participants must download CSV manually.
  // Google Sheets backup (secondary to Firebase). Reuses the pilot's Web App URL.
  // NOTE: to capture the new columns (iu1..iu12, survey_comments, distress, etc.) in
  // the Sheet, redeploy the patched google_apps_script.js (writes to a 'study4' tab).
  // Firebase (below) is primary and already stores the full payload regardless.
  sheetsWebAppURL: 'https://script.google.com/macros/s/AKfycbxQgPXeHqkUAs6hD74neYrIQKGfo3gpfEoGrEBqUqnmJtCn5tYxUYH8QfeSW6kfLbeg2Q/exec',

  // -- Firebase config ------------------------------------------
  // PRIMARY data store \u{2014} handles high concurrency.
  // Steps: https://console.firebase.google.com
  //   1. Create project \u{2192} Add web app \u{2192} copy config below
  //   2. Build \u{2192} Firestore Database \u{2192} Create (Production mode)
  //   3. Rules tab \u{2192} paste the rules from FIREBASE_SETUP.md \u{2192} Publish
  //   4. Fill in the values below (apiKey etc.)
  // Leave as null to disable Firebase and fall back to Sheets only.
  // Reusing the pilot's Firebase project ('reassurance-study'). Study 4 data lands in
  // the same 'responses' collection as Study 3 / the pilot -- separate it later by
  // timestamp / the new columns (distress, iu1..iu12). Firestore rules already allow writes.
  firebaseConfig: {
    apiKey:            "AIzaSyCIM6_tme19BJNNhjc7G1GRssj_gTvNhiA",
    authDomain:        "reassurance-study.firebaseapp.com",
    projectId:         "reassurance-study",
    storageBucket:     "reassurance-study.firebasestorage.app",
    messagingSenderId: "762220390900",
    appId:             "1:762220390900:web:890065a172a6a24dd5f1a1"
  },

  // CloudResearch Connect completion code shown on the final screen.
  // Per CloudResearch: display the CODE (participants return to Connect and enter it),
  // do NOT auto-redirect via a completion link \u{2014} a redirect prevents Connect from
  // recognizing who completed the survey.
  cloudResearchCompletionCode: 'B7EA184BF6',  // \u{26A0}\u{FE0F} pilot/Study-3 code -- REPLACE with Study 4's own CloudResearch Connect completion code before launch

  // Redirect URL is intentionally left blank (do not auto-redirect to Connect).
  cloudResearchCompletionURL: '',

  // Wait time (seconds) when participant chooses "Contact now."
  // Set to 0 for researcher testing (skips countdown, still reveals result).
  waitSecs: 15,

  // Fee to open a result now, in points. Kept deliberately small so a rational
  // "why pay for pointless info" calculation does not dominate the emotional
  // (reassurance/avoidance) motive -- the pilot's No-Instrumentality free-text
  // showed the 5-pt fee was the main reason people never opened. Tunable.
  scoutFee: 2,

  // Payment details (shown to participants in instructions).
  pointValue:       0.25,   // $ per point
  eligiblePct:      10,     // % of participants eligible for real payment
  maxPayout:        26.25,  // $ max payout
  paymentDelay:     '1 week'
};

// ===============================================================
//  CONDITION ASSIGNMENT
//
//  BETWEEN-SUBJECTS via URL parameter:
//    ?condition=none   \u{2192} No Instrumentality  (H1: probability reversal)
//    ?condition=low    \u{2192} Low Instrumentality  (intermediate)
//    ?condition=high   \u{2192} High Instrumentality (H2: instrumentality reversal)
//
//  If not in URL, randomly assigned 50/50 between 'none' and 'high'.
// ===============================================================

const CFG = {
  studyName:    'Reassurance-Seeking Experiment \u{2014} Study 4',
  endowment:    105,   // total points given to participant
  coins:        100,   // points at stake on each section's bonus
  // Study 4 loss-probability levels (5% \u{2026} 50%): a wider range than Study 3, spanning
  // the low-risk regime (where reassurance-seeking is predicted) up to an even coin-flip.
  probabilities: [0.05, 0.10, 0.20, 0.30, 0.50, 0.70],
  practiceProb:  0.40,   // practice-round loss chance (distinct from real levels; doesn't count)
  conditions: {
    none: {
      label:      'No Instrumentality',
      cls:        'cond-none',
      recoverable: 0,
      ifBadNews:  'this result is <strong>final</strong> \u{2014} opening it now <strong>cannot change it</strong>. You just find out now instead of in a week.',
      nowDesc:    'Find out today. You can\'t change the result \u{2014} but you end the not-knowing now: <strong>relief</strong> if it\'s good news, or knowing the loss and sitting with it.',
      waitDesc:   'Leave it sealed \u{2014} find out in <strong>1 week</strong>. You carry the <strong>uncertainty</strong> until then.',
      debrief:    'In your condition, opening early had <strong>no practical value</strong> \u{2014} the result was final and could not be changed. Our theory predicts reassurance-seeking should dominate: people open <em>more when a good outcome is likely</em> (low chance of a loss, to feel reassured) and <em>less when a loss is likely</em> (to avoid the bad news).'
    },
    low: {
      label:      'Low Instrumentality',
      cls:        'cond-low',
      recoverable: 20,
      ifBadNews:  'you can trigger a small <strong>recovery option</strong> \u{2014} getting back about <strong>20 of 100 points</strong> (you lose 80 instead of 100). It\'s only available if you open the result now.',
      nowDesc:    'Find out today. If it\'s a loss, a small recovery option gets back ~20 points; if it\'s good, relief (and you keep your points, minus the open fee).',
      waitDesc:   'Wait a week to find out \u{2014} but too late for the recovery option, and you carry the uncertainty until then. A loss then costs the full 100 points.',
      debrief:    'In your condition, opening early had <strong>limited practical value</strong> (a small recovery). Our theory predicts reassurance-seeking still adds to information-seeking, especially when a good outcome is likely.'
    },
    high: {
      label:      'High Instrumentality',
      cls:        'cond-high',
      recoverable: 60,
      ifBadNews:  'you can trigger a full <strong>recovery option</strong> \u{2014} getting back about <strong>60 of 100 points</strong> (you lose only 40 instead of 100). It\'s only available if you open the result now.',
      nowDesc:    'Find out today. If it\'s a loss, a full recovery option gets back ~60 points; if it\'s good, relief (and you keep your points, minus the open fee).',
      waitDesc:   'Wait a week to find out \u{2014} but too late for the recovery option, and you carry the uncertainty until then. A loss then costs the full 100 points.',
      debrief:    'In your condition, opening early had <strong>high practical value</strong> (a large recovery on a loss). Our theory predicts practical value increases information-seeking, especially when a loss is more likely.'
    }
  }
};

// ===============================================================
//  FIREBASE INIT (runs once at load if config is provided)
// ===============================================================
let _db = null;
(function initFirebase() {
  if (!RESEARCHER.firebaseConfig) return;
  try {
    firebase.initializeApp(RESEARCHER.firebaseConfig);
    _db = firebase.firestore();
    // Enable offline persistence so a brief connectivity blip doesn't lose data
    _db.enablePersistence({ synchronizeTabs: true }).catch(() => {});
  } catch (e) {
    console.warn('Firebase init failed:', e);
  }
})();

// ===============================================================
//  STATE
// ===============================================================
const S = {
  screen:       'welcome',
  condition:    null,
  conditionSource: null,
  pid:          null,
  crID:         null,   // CloudResearch Connect participantId
  assignmentID: null,   // CloudResearch Connect assignmentId (optional)
  projectID:    null,   // CloudResearch Connect projectId (optional)
  studyID:      null,
  sessionID:    null,
  platform:     null,
  participantID:    '',
  participantName:  '',
  participantEmail: '',
  trialOrder:   [],
  currentTrial: 0,
  currentChoice: null,
  currentOutcome: null,   // true = mishap occurred, false = no mishap, null = not contacted
  trialStartTime: null,
  responses:    [],
  compErrors:   0,
  compAnswers:  { q1: null, q2: null },
  countdownInterval:  null,
  countdownRemaining: 0,
  saveStatus: 'pending',
  debugMode: false,    // set to true via ?debug=1 in URL \u{2014} shows researcher info
  // Post-experiment survey (collected at likert_end)
  survey: {
    reassurance:    null,  // 1\u{2013}7: "I looked hoping for reassuring news"
    fear_avoidance: null,  // 1\u{2013}7: "When a bad score was likely I avoided looking"
    instrumental:   null,  // 1\u{2013}7: "I looked to be able to act (practice/retake)"
    curiosity:      null,  // 1\u{2013}7: "I looked simply because I was curious"
    pattern:        null,  // categorical: more_low | more_high | no_pattern | always | never
    motive_lowrisk: null,  // categorical main reason in the low-probability rounds
    open_response:  '',    // free text
    iu:  {},   // IU-12 items (1\u{2013}5), keys iu1..iu12
    comments: ''          // optional open comments on the study (always shown)
  },
  isPractice:   false, // true during the (uncounted) practice round
  // Study 4 (danger line + sealed outcome spin, per round)
  roundRisk: null,     // this round's RISK number T (1\u{2013}100), preset = the loss %
  roundSpin: null,     // this round's OUTCOME spin (1\u{2013}100); \u{2264} T = loss
  roundLoss: null,     // whether this round is a loss (outcome spin \u{2264} T)
  decideStart: null,   // timestamp when the pay/wait choice becomes available
  roundDistress: null, // per-trial: "how much does not knowing bother you right now?" (1-7)
  perceivedScore: null // participant's expectation: how many of the rounds they think are good
};

// ===============================================================
//  HELPERS
// ===============================================================
function uid() { return 'P' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2,6).toUpperCase(); }
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function pct(p)      { return (p*100).toFixed(0)+'%'; }
function riskColor(p){ return p<=.20?'#22c55e':p<=.40?'#84cc16':p<=.60?'#f59e0b':p<=.80?'#f97316':'#ef4444'; }
function riskWord(p) { return p<=.15?'Very Low Risk':p<=.35?'Low Risk':p<=.65?'Moderate Risk':p<=.80?'High Risk':'Very High Risk'; }
function cond()      { return CFG.conditions[S.condition]; }
// Current round's loss probability \u{2014} practice uses a fixed level, real rounds use the shuffled order.
function roundProb() { return S.isPractice ? CFG.practiceProb : S.trialOrder[S.currentTrial]; }

function render() {
  if (S.countdownInterval) { clearInterval(S.countdownInterval); S.countdownInterval=null; }
  const fn = {
    welcome:       renderWelcome,
    demographics:  renderDemographics,
    insight:       renderInsight,
    instructions:  renderInstructions,
    comprehension: renderComprehension,
    riskspin:      renderRiskSpin,
    lockspin:      renderLockSpin,
    result:        renderResult,
    likert_end:    renderLikertEnd,
    end:           renderEnd
  }[S.screen] || renderWelcome;
  document.getElementById('root').innerHTML = fn();
  if (S.screen === 'riskspin') spinRiskWheel();
  if (S.screen === 'lockspin') spinLockWheel();
  if (S.screen === 'end')     attemptSheetsSave();
}

function go(screen) { S.screen=screen; window.scrollTo(0,0); render(); }

// ===============================================================
//  INIT
// ===============================================================
function init() {
  const p = new URLSearchParams(window.location.search);

  S.debugMode = p.get('debug') === '1';

  const c = p.get('condition');
  if (c==='none'||c==='low'||c==='high') { S.condition=c; S.conditionSource='url'; }
  else { S.condition=Math.random()<.5?'none':'high'; S.conditionSource='random'; }

  // CloudResearch Connect identifiers passed from Qualtrics via the redirect URL, e.g.
  // ?condition=none&participantId=...&assignmentId=...&projectId=...
  const crID = p.get('participantId') || p.get('participant_id')
            || p.get('CLOUDRESEARCH_PID') || p.get('cloudresearch_pid')
            || p.get('cr_id');
  const assignmentID = p.get('assignmentId') || p.get('assignment_id') || '';
  const projectID    = p.get('projectId')    || p.get('project_id')    || '';

// ===============================================================
//  SCREEN: INSIGHT TEST (ego manipulation \u{2014} nominal score)
//  A short reasoning set that makes the "score" personally real.
//  Answers are recorded but the reported score is nominal.
// ===============================================================
// -- PER-ROUND MECHANIC: two wheels (risk wheel + outcome wheel) --
// Spin 1 = risk wheel, PRESET to the section's loss level (T = 100\u{B7}p \u{2192} the
// manipulated factor p \u{2208} {10,30,50,70,90}%). An outcome is then drawn by a genuine spin
// (1\u{2013}100) and SEALED (run, not shown). Spin ABOVE the line = a loss. Honest, since
// P(spin > T) = (100\u{2212}T)/100 = p exactly. The participant pays a fee to REVEAL the sealed
// outcome now (information-seeking), or waits to find out in a week.
function sealRound(){
  const p = roundProb();
  S.roundDistress = null;                             // reset per-trial feeling item
  S.roundRisk = Math.round(100 * p);                 // RISK wheel value = the loss % (1\u{2013}100), preset
  S.roundSpin = 1 + Math.floor(Math.random()*100);   // OUTCOME wheel value (1\u{2013}100), genuine spin
  S.roundLoss = S.roundSpin <= S.roundRisk;          // lose if the outcome lands at/below the risk number
}

function polar(cx,cy,r,angDeg){ const a=(angDeg-90)*Math.PI/180; return {x:cx+r*Math.cos(a), y:cy+r*Math.sin(a)}; }
// -- SPIN 1: RISK WHEEL (preset \u{2014} reveals the round's loss %) --
function riskWheelSVG(){
  const cx=120,cy=120,r=100,rin=60,segs=20, cols=['#3987e5','#6da7ec'];
  let s=`<svg width="240" height="240" viewBox="0 0 240 240" aria-label="risk wheel">`;
  for(let i=0;i<segs;i++){ const a0=i/segs*360, a1=(i+1)/segs*360;
    const p0=polar(cx,cy,r,a0),p1=polar(cx,cy,r,a1),q1=polar(cx,cy,rin,a1),q0=polar(cx,cy,rin,a0);
    s+=`<path d="M${p0.x.toFixed(1)} ${p0.y.toFixed(1)} A${r} ${r} 0 0 1 ${p1.x.toFixed(1)} ${p1.y.toFixed(1)} L${q1.x.toFixed(1)} ${q1.y.toFixed(1)} A${rin} ${rin} 0 0 0 ${q0.x.toFixed(1)} ${q0.y.toFixed(1)} Z" fill="${cols[i%2]}"/>`; }
  s+=`<circle cx="120" cy="120" r="59" fill="#fff"/></svg>`;
  return s;
}
function renderRiskSpin(){

  return `

  ${prac?`<div class="infobox ib-blue" style="margin-bottom:20px;"><strong>\u{1F3AF} Practice round</strong> \u{2014} a quick walkthrough of both wheels. This one <strong>does not count</strong> toward your reward.</div>`:''}

      <div id="rnum" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#111827;">\u{2013}</div>

      <div class="infobox ib-amber" style="text-align:left;"><strong>A <span id="rrisk-txt"></span>% chance of losing 100.</strong> Next, the outcome wheel is spun \u{2014} it lands on a number from <strong>1 to 100</strong>; you lose if it is <strong>at or below <span id="rrisk-cut"></span></strong>, and keep the 100 points otherwise.</div>
      <div class="btn-row"><button class="btn btn-primary" onclick="go('lockspin')">Continue \u{2192}</button></div>
    </div>
  </div>
</div>`;
}
function spinRiskWheel(){
  const wheel=document.getElementById('rwheel'), num=document.getElementById('rnum');
  const T=S.roundRisk, finalRot=6*360 - (T/100*360);
  requestAnimationFrame(()=>{ if(wheel) wheel.style.transform=`rotate(${finalRot}deg)`; });
  let ticks=0; const iv=setInterval(()=>{ if(num) num.textContent=1+Math.floor(Math.random()*100); if(++ticks>28) clearInterval(iv); },95);
  setTimeout(()=>{ clearInterval(iv); if(num){ num.textContent=T; num.style.color='#b45309'; }
    const t=document.getElementById('rrisk-txt'); if(t) t.textContent=`${T}`;
    const cut=document.getElementById('rrisk-cut'); if(cut) cut.textContent=`${T}`;
    const d=document.getElementById('rrisk-done'); if(d) d.classList.remove('hidden');
  },3100);
}

      <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;">

    <div class="likert-group" style="margin:14px 0 4px;">
      <div class="likert-q" style="text-align:center;">Right now, how much does <strong>not knowing this result</strong> bother you?</div>
      <div class="likert-scale" id="distress-scale">${[1,2,3,4,5,6,7].map(x=>`<input type="radio" name="distress" id="distress_${x}" value="${x}" onchange="S.roundDistress=${x};document.getElementById('distress-err').classList.add('hidden')"><label for="distress_${x}">${x}</label>`).join('')}</div>
      <div class="likert-ends"><span>Not at all</span><span>A great deal</span></div>
    </div>
    <div id="distress-err" class="error-msg hidden" style="text-align:center;">Please answer the question above first.</div>

    <h3 style="text-align:center;margin-top:10px;">Do you want to know the result?</h3>
    <button class="choice-btn" onclick="decide('now')">
      <div class="c-title">\u{1F50E} Yes \u{2014} pay ${RESEARCHER.scoutFee} to see it now</div>
      <div class="c-desc">${cd.nowDesc}</div>
      <span class="c-cost">\u{1F4B0} ${RESEARCHER.scoutFee} pt fee</span>
    </button>
    <button class="choice-btn" onclick="decide('wait')">
      <div class="c-title">\u{23F3} No \u{2014} see it later, for free</div>
      <div class="c-desc">${cd.waitDesc} You keep the ${RESEARCHER.scoutFee}-point fee.</div>
    </button>
  </div>
</div>`;
}
function spinLockWheel(){
  const wheel=document.getElementById('lwheel'), num=document.getElementById('lnum');
  const finalRot=6*360 + Math.floor(Math.random()*360);   // decorative spin; true result = S.roundSpin (hidden)
  requestAnimationFrame(()=>{ if(wheel) wheel.style.transform=`rotate(${finalRot}deg)`; });
  let ticks=0; const iv=setInterval(()=>{ if(num) num.textContent=1+Math.floor(Math.random()*100); if(++ticks>28) clearInterval(iv); },95);
  setTimeout(()=>{ clearInterval(iv); if(num){ num.textContent='\u{1F512}'; num.style.fontSize='40px'; }
    const st=document.getElementById('lspin-status'); if(st) st.textContent='Result locked in';
    const d=document.getElementById('decide-block'); if(d) d.classList.remove('hidden');
    S.decideStart = Date.now();
  },3100);
}
// Merged decision (shown right under the locked wheel): know now vs see later.
function decide(choice){
  // Require the per-trial feeling item before a real choice (not in practice).
  if (!S.isPractice && S.roundDistress == null) {
    const e=document.getElementById('distress-err'); if(e) e.classList.remove('hidden'); return;
  }
  S.currentChoice = choice;
  // Practice round: don't record data; route back into the real trials.
  if (!S.isPractice) {
    S.responses.push({
      trial: S.currentTrial+1, probability: S.trialOrder[S.currentTrial], seek_now: choice==='now'?1:0,
      rt_decision_ms: Date.now() - (S.decideStart || Date.now()), rt_wait_ms: 0,
      outcome: S.roundLoss ? 'mishap' : 'none', risk: S.roundRisk, spin: S.roundSpin,
      distress: S.roundDistress,
      reassurance:null, fear:null, action:null
    });
  }
  if (choice === 'now') { S.currentOutcome = S.roundLoss; go('result'); }
  else { S.currentChoice = null; if (S.isPractice) startTrials(); else advanceTrial(); }
}

function renderResult() {
  const mishap = S.currentOutcome;
  const cd = cond();
  const prac = S.isPractice;
  const p = roundProb();
  const round = S.currentTrial + 1;
  const total = S.trialOrder.length;
  const isLast = (S.currentTrial + 1) >= total;

  let headline, body, boxCls;
  const fee = RESEARCHER.scoutFee;
  if (!mishap) {
    headline = '\u{2705} Good outcome \u{2014} not a loss!';
    body = `This sealed result came out in your favour.
      <br><br><em>If this section is selected: <strong>${CFG.endowment - fee} points</strong> (105 \u{2212} ${fee} open fee = ${CFG.endowment - fee} pts = $${((CFG.endowment - fee) * RESEARCHER.pointValue).toFixed(2)}).</em>`;
    boxCls = 'ib-green';
  } else if (S.condition === 'none') {
    headline = '\u{26A0}\u{FE0F} A loss.';
    body = `The result is final \u{2014} you couldn't change it, but you now know instead of waiting a week. You lose the 100-point stake.
      <br><br><em>If this section is selected: <strong>0 points</strong> (you lose the 100-pt stake; open fee already spent = 0 pts = $0.00).</em>`;
    boxCls = 'ib-red';
  } else if (S.condition === 'low') {
    headline = '\u{26A0}\u{FE0F} A loss.';
    body = `You trigger the recovery option, getting back 20 points. You lose 80 instead of 100.
      <br><br><em>If this section is selected: <strong>${CFG.endowment - fee - 80} points</strong> (105 \u{2212} ${fee} fee \u{2212} 80 loss = ${CFG.endowment - fee - 80} pts = $${((CFG.endowment - fee - 80) * RESEARCHER.pointValue).toFixed(2)}).</em>`;
    boxCls = 'ib-amber';
  } else {
    headline = '\u{26A0}\u{FE0F} A loss.';
    body = `You trigger the recovery option, getting back 60 points. You lose only 40 instead of 100.
      <br><br><em>If this section is selected: <strong>${CFG.endowment - fee - 40} points</strong> (105 \u{2212} ${fee} fee \u{2212} 40 loss = ${CFG.endowment - fee - 40} pts = $${((CFG.endowment - fee - 40) * RESEARCHER.pointValue).toFixed(2)}).</em>`;
    boxCls = 'ib-amber';
  }

  const resultBox = prac
    ? `<div class="infobox ib-blue" style="font-size:16px;">
         <strong>${mishap ? '\u{26A0}\u{FE0F} That would have been a loss.' : '\u{2705} That would have been a good outcome.'}</strong><br><br>
         This was the <strong>practice round</strong> \u{2014} it doesn't affect your reward. You've now seen both wheels and the pay-to-know choice. The <strong>${S.trialOrder.length} real rounds</strong> start next.
       </div>`
    : `<div class="infobox ${boxCls}" style="font-size:16px;">
         <strong>${headline}</strong><br><br>${body}
       </div>`;

  return `
<div class="card">
  <div class="progress-wrap">
    <div class="progress-meta"><span>${prac ? 'Practice round \u{2014} Result' : `Round ${round} of ${total} \u{2014} Result`}</span><span>${pct(p)} chance it's a loss</span></div>
    <div class="progress-track"><div class="progress-fill" style="width:${prac ? 100 : (round/total)*100}%"></div></div>
  </div>
  <h2>Your Outcome</h2>
  <div class="risk-box" style="text-align:center;">
    <div style="font-size:12px;color:#6b7280;text-transform:uppercase;letter-spacing:.5px;">Your outcome spin</div>
    <div style="font-size:42px;font-weight:900;line-height:1.1;color:${S.roundLoss?'#ef4444':'#22c55e'};">${S.roundSpin}</div>
    <div style="font-size:14px;color:#6b7280;">Risk number was <strong>${S.roundRisk}</strong> \u{2014} ${S.roundLoss ? 'outcome at or below it \u{2192} <strong style="color:#ef4444">loss</strong>' : 'outcome above it \u{2192} <strong style="color:#22c55e">safe</strong>'}</div>
  </div>

  <div class="btn-row">
    <button class="btn btn-primary" onclick="${prac ? 'startTrials()' : 'afterResult()'}">
      ${prac ? `Start the ${S.trialOrder.length} real rounds \u{2192}` : (isLast ? 'Answer Questions \u{2192}' : 'Next Round \u{2192}')}
    </button>
  </div>
</div>`;
}

function afterResult() {
  S.currentOutcome = null;
  S.currentChoice = null;
  advanceTrial();
}

function advanceTrial() {
  S.currentTrial++;
  if (S.currentTrial < S.trialOrder.length) {
    S.trialStartTime = Date.now();
    sealRound();
    go('riskspin');
  } else {
    go('likert_end');
  }
}

function renderLikertEnd() {
  // Build a brief summary of their choices for context
  const sorted = [...S.responses].sort((a,b) => a.probability - b.probability);
  const choiceSummary = sorted.map(r =>
    `<span style="display:inline-flex;align-items:center;gap:5px;margin:3px 4px;font-size:13px;background:${r.seek_now?'#eff6ff':'#f9fafb'};border:1px solid ${r.seek_now?'#bfdbfe':'#e5e7eb'};border-radius:99px;padding:3px 11px;font-weight:600;color:${r.seek_now?'#1d4ed8':'#6b7280'};">
      ${pct(r.probability)}: ${r.seek_now?'\u{1F50E} Opened':'\u{23F3} Waited'}
    </span>`
  ).join('');

  function lk(name, q) {
    const opts = [1,2,3,4,5,6,7].map(v =>
      `<input type="radio" name="${name}" id="${name}_${v}" value="${v}"><label for="${name}_${v}">${v}</label>`
    ).join('');
    return `<div class="likert-group">
      <div class="likert-q">${q}</div>
      <div class="likert-scale">${opts}</div>
      <div class="likert-ends"><span>Strongly Disagree</span><span>Strongly Agree</span></div>
    </div>`;
  }

  // Generic n-point scale (for IU-12 = 5 pts, trait anxiety = 4 pts)
  function lkN(name, q, n, lowLbl, highLbl) {
    const opts = Array.from({length:n},(_,i)=>i+1).map(v =>
      `<input type="radio" name="${name}" id="${name}_${v}" value="${v}"><label for="${name}_${v}">${v}</label>`
    ).join('');
    return `<div class="likert-group">
      <div class="likert-q">${q}</div>
      <div class="likert-scale" style="grid-template-columns:repeat(${n},1fr);">${opts}</div>
      <div class="likert-ends"><span>${lowLbl}</span><span>${highLbl}</span></div>
    </div>`;
  }

  // Intolerance of Uncertainty \u{2014} Short Form (IUS-12; Carleton et al., 2007), 1\u{2013}5
  const IU_ITEMS = [
    'Unforeseen events upset me greatly.',
    'It frustrates me not having all the information I need.',
    'Uncertainty keeps me from living a full life.',
    'One should always look ahead so as to avoid surprises.',
    'A small, unforeseen event can spoil everything, even with the best of planning.',
    'When it\u{2019}s time to act, uncertainty paralyses me.',
    'When I am uncertain I can\u{2019}t function very well.',
    'I always want to know what the future has in store for me.',
    'I can\u{2019}t stand being taken by surprise.',
    'The smallest doubt can stop me from acting.',
    'I should be able to organize everything in advance.',
    'I must get away from all uncertain situations.'
  ];
  const iuBlock  = IU_ITEMS.map((q,i)=>lkN('iu'+(i+1),  (i+1)+'. '+q, 5, 'Not at all characteristic', 'Entirely characteristic')).join('');

  const patternOpts = [
    ['more_low',  '\u{1F4C9} I opened the result more when a loss was <strong>less likely</strong>'],
    ['more_high', '\u{1F4C8} I opened the result more when a loss was <strong>more likely</strong>'],
    ['no_pattern','\u{1F500} My choices didn\'t follow a clear pattern across sections'],
    ['always',    '\u{2705} I opened the result in every section'],
    ['never',     '\u{23F3} I never opened the result']
  ];

  const motiveOpts = [
    ['instrumental_act', 'To be able to act on it \u{2014} use the recovery option if it was a loss'],
    ['reassure',         'To feel reassured \u{2014} to stop the discomfort of not knowing and hope for a good outcome'],
    ['brace_badnews',    'To brace myself for a loss'],
    ['curious',          'Just curious about the result']
  ];
  const lowRiskMotiveOpts = motiveOpts.concat([['didnt_send', 'I didn\'t open the result in those sections']]);

  return `
<div class="card">
  <span class="step-pill">Reflection</span>
  <h2>A Few Questions</h2>
  <p>You've completed all ${S.responses.length} rounds. Here's a quick summary of your choices:</p>
  <div style="margin-bottom:24px;line-height:2;">${choiceSummary}</div>

  <hr class="divider">

  <h3>Your Pattern of Choices</h3>
  <p style="font-size:15px;color:#374151;margin-bottom:18px;">Which best describes how your choices changed (or didn't) as the chance of a loss increased?</p>
  ${patternOpts.map(([val,label])=>`
  <label class="radio-option" id="pat-${val}">
    <input type="radio" name="pattern" value="${val}" onchange="S.survey.pattern='${val}'">
    <span>${label}</span>
  </label>`).join('')}

  <div style="margin-top:26px;">
    <h3>In the Low-Risk Rounds</h3>
    <p style="font-size:15px;color:#374151;margin-bottom:14px;">In the sections where a loss was <strong>less likely</strong>, if you opened the result, what were you mainly after?</p>
    ${lowRiskMotiveOpts.map(([val,label])=>`
    <label class="radio-option" id="lrm-${val}">
      <input type="radio" name="motive_lowrisk" value="${val}" onchange="S.survey.motive_lowrisk='${val}'">
      <span>${label}</span>
    </label>`).join('')}
  </div>

  <div style="margin-top:20px;">
    <div class="likert-q" style="margin-bottom:10px;">In your own words \u{2014} why did you make the choices you did? What was going through your mind?</div>
    <textarea id="open-response" rows="4" placeholder="Describe your reasoning here\u{2026}"
      style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;outline:none;"
      oninput="S.survey.open_response=this.value"
      onfocus="this.style.borderColor='#3b82f6'"
      onblur="this.style.borderColor='#e5e7eb'"></textarea>
  </div>

  <hr class="divider">

  <h3>What Drove Your Decisions?</h3>
  <p style="font-size:14px;color:#6b7280;margin-bottom:22px;">Rate how much each statement describes your overall motivation across the rounds. Use 1 (Strongly Disagree) to 7 (Strongly Agree).</p>

  ${lk('reassurance', '1. &ldquo;When a loss was <strong>unlikely</strong>, I opened the result mainly to get <strong>reassuring news</strong> \u{2014} hoping for a good outcome.&rdquo;')}
  ${lk('fear_avoid',  '2. &ldquo;When a loss was <strong>likely</strong>, I was less willing to open the result because I <strong>feared the bad news</strong>.&rdquo;')}
  ${lk('instrumental','3. &ldquo;I opened the result mainly so I could <strong>act on it</strong> (use the recovery option) if it was a loss.&rdquo;')}
  ${lk('curiosity',   '4. &ldquo;I opened the result simply because I was <strong>curious</strong> about it.&rdquo;')}

  <hr class="divider">
  <h3>How You Handle Uncertainty</h3>
  <p style="font-size:14px;color:#6b7280;margin-bottom:22px;">These statements are about you in general, not this study. Rate how characteristic each is of you, from 1 (Not at all) to 5 (Entirely).</p>
  ${iuBlock}

  <hr class="divider">
  <h3>Any Comments?</h3>
  <p style="font-size:14px;color:#4b5563;margin-bottom:12px;">Any thoughts on the study? Was anything <strong>confusing or unclear</strong>, or did you notice any <strong>glitches</strong> or display problems? Anything that would make it easier to follow is welcome. <em>(Optional.)</em></p>
  <textarea id="comments" rows="4" placeholder="Your comments on the study\u{2026}"
    style="width:100%;padding:12px 16px;border:2px solid #e5e7eb;border-radius:10px;font-size:15px;font-family:inherit;resize:vertical;outline:none;"
    oninput="S.survey.comments=this.value"
    onfocus="this.style.borderColor='#3b82f6'"
    onblur="this.style.borderColor='#e5e7eb'"></textarea>

  <div id="likert-err" class="error-msg hidden">Please answer every question above before continuing.</div>
  <div class="btn-row">
    <button class="btn btn-primary" onclick="submitLikertEnd()">Complete Study \u{2192}</button>
  </div>
</div>`;
}

function submitLikertEnd() {
  const r   = document.querySelector('input[name="reassurance"]:checked');
  const f   = document.querySelector('input[name="fear_avoid"]:checked');
  const a   = document.querySelector('input[name="instrumental"]:checked');
  const cur = document.querySelector('input[name="curiosity"]:checked');
  const pat = S.survey.pattern;
  const lrm = S.survey.motive_lowrisk;

  // Collect IU-12 (iu1..iu12)
  const iu = {};
  let iuMissing = false;
  for (let i=1;i<=12;i++){ const el=document.querySelector('input[name="iu'+i+'"]:checked'); if(!el){iuMissing=true;} else {iu['iu'+i]=parseInt(el.value);} }

  if (!r || !f || !a || !cur || !pat || !lrm || iuMissing) {
    showErr('likert-err', 'Please answer every question above before continuing.');
    return;
  }

  S.survey.reassurance    = parseInt(r.value);
  S.survey.fear_avoidance = parseInt(f.value);
  S.survey.instrumental   = parseInt(a.value);
  S.survey.curiosity      = parseInt(cur.value);
  S.survey.open_response  = document.getElementById('open-response').value.trim();
  S.survey.iu  = iu;
  const pf = document.getElementById('comments');
  if (pf) S.survey.comments = pf.value.trim();

  go('end');
}

function attemptSheetsSave() {   // called from render() \u{2014} name kept for compatibility
  if (_db) {
    saveToFirebase();
  } else if (RESEARCHER.sheetsWebAppURL) {
    saveToSheets();
  } else {
    updateSaveUI('failed', 'Auto-save not configured. Please download CSV below.');
  }
}

function saveToFirebase() {
  updateSaveUI('saving', 'Saving to Firebase\u{2026}');
  const payload = buildPayload();
  // Use pid as document ID \u{2014} prevents duplicate documents if page is reloaded
  _db.collection('responses').doc(S.pid).set(payload)
    .then(() => {
      updateSaveUI('saved', '\u{2705} Data saved to Firebase. Download CSV below as your own backup.');
      // Also attempt Sheets as a secondary backup (don't update UI on result)
      if (RESEARCHER.sheetsWebAppURL) saveToSheetsSilent();
    })
    .catch(err => {
      console.warn('Firebase save failed, trying Sheets:', err);
      updateSaveUI('saving', '\u{26A0}\u{FE0F} Firebase failed \u{2014} trying backup server\u{2026}');
      if (RESEARCHER.sheetsWebAppURL) {
        saveToSheets();
      } else {
        updateSaveUI('failed', `\u{26A0}\u{FE0F} Save failed: ${err.message}. Download CSV below.`);
      }
    });
}

function saveToSheets() {
  updateSaveUI('saving', 'Saving to Google Sheets\u{2026}');
  const payload = buildPayload();
  const url = RESEARCHER.sheetsWebAppURL + '?data=' + encodeURIComponent(JSON.stringify(payload));
  fetch(url)
    .then(r => r.json())
    .then(resp => {
      if (resp.status === 'ok') {
        updateSaveUI('saved', `\u{2705} ${resp.rows} rows saved to Google Sheets. Download CSV as backup.`);
      } else {
        updateSaveUI('failed', `\u{26A0}\u{FE0F} Sheets error: ${resp.message || 'unknown'}. Download CSV below.`);
      }
    })
    .catch(err => {
      updateSaveUI('failed', `\u{26A0}\u{FE0F} Save failed: ${err.message}. Download CSV below.`);
    });
}

function saveToSheetsSilent() {
  const payload = buildPayload();
  const url = RESEARCHER.sheetsWebAppURL + '?data=' + encodeURIComponent(JSON.stringify(payload));
  fetch(url).catch(() => {});  // silent fallback \u{2014} Firebase already confirmed save
}

function updateSaveUI(status, msg) {
  S.saveStatus = status;
  const dot = document.getElementById('save-dot');
  const txt = document.getElementById('save-msg');
  if (dot) { dot.className = 'save-dot ' + status; }
  if (txt) { txt.textContent = msg; }
}

function buildPayload() {
  return {
    study:             CFG.studyName,
    timestamp:         new Date().toISOString(),
    pid:               S.pid,
    cloudresearch_id:  S.crID || '',
    participant_id:    S.crID || '',           // CloudResearch Connect participantId (lottery matching)
    assignment_id:     S.assignmentID || '',   // CloudResearch Connect assignmentId
    project_id:        S.projectID || '',      // CloudResearch Connect projectId
    participant_name:  S.participantName,
    participant_email: S.participantEmail,
    study_id:          S.studyID || '',
    session_id:        S.sessionID || '',
    condition:         S.condition,
    condition_label:   cond().label,
    condition_source:  S.conditionSource,
    platform:          S.platform,
    comp_errors:       S.compErrors,
    scout_fee:         RESEARCHER.scoutFee,
    wait_secs:         RESEARCHER.waitSecs,
    trial_order:       S.trialOrder.map(p=>+(p.toFixed(2))),
    survey_reassurance:    S.survey.reassurance,
    survey_fear_avoidance: S.survey.fear_avoidance,
    survey_instrumental:   S.survey.instrumental,
    survey_curiosity:      S.survey.curiosity,
    survey_pattern:        S.survey.pattern,
    survey_motive_lowrisk: S.survey.motive_lowrisk,

    iu_total:              Object.keys(S.survey.iu).length  ? Object.values(S.survey.iu).reduce((s,v)=>s+v,0)  : '',
    ...S.survey.iu,
    survey_comments:       S.survey.comments,
    responses:             S.responses
  };
}

//  DATA EXPORT (CSV + JSON)
// ===============================================================
function dlCSV() {
  const cols = [
    'pid','cloudresearch_id','participant_id','assignment_id','project_id','participant_name','participant_email',
    'platform','condition','condition_label','condition_source',
    'trial','probability','seek_now','outcome','risk_number','outcome_spin','distress',
    'rt_decision_ms','rt_wait_ms',
    'comp_errors','scout_fee',
    'survey_reassurance','survey_fear_avoidance','survey_instrumental','survey_curiosity','survey_pattern','survey_motive_lowrisk','survey_open',
    'iu_total',
    'survey_comments',
    'timestamp'
  ];
  const ts = new Date().toISOString();
  const iuT  = Object.keys(S.survey.iu).length  ? Object.values(S.survey.iu).reduce((s,v)=>s+v,0)  : '';
  const rows = S.responses.map(r => [
    S.pid, S.crID||'', S.crID||'', S.assignmentID||'', S.projectID||'', S.participantName, S.participantEmail,
    S.platform, S.condition, cond().label, S.conditionSource,
    r.trial, r.probability.toFixed(2), r.seek_now, r.outcome??'', r.risk??'', r.spin??'', r.distress??'',
    r.rt_decision_ms, r.rt_wait_ms??0,
    S.compErrors, RESEARCHER.scoutFee,
    S.survey.reassurance??'', S.survey.fear_avoidance??'', S.survey.instrumental??'', S.survey.curiosity??'',
    S.survey.pattern??'', S.survey.motive_lowrisk??'', `"${(S.survey.open_response||'').replace(/"/g,'""')}"`,
    iuT,
    `"${(S.survey.comments||'').replace(/"/g,'""')}"`,
    ts
  ].map(v=>typeof v === 'string' && v.startsWith('"') ? v : (String(v).includes(',') ? `"${v}"` : v)).join(','));
  dlFile([cols.join(','),...rows].join('\n'), `RS_${S.pid}.csv`, 'text/csv');
}

function dlJSON() {
  dlFile(JSON.stringify(buildPayload(), null, 2), `RS_${S.pid}.json`, 'application/json');
}

function dlFile(content, name, mime) {
  const url=URL.createObjectURL(new Blob([content],{type:mime}));
  const a=Object.assign(document.createElement('a'),{href:url,download:name});
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

//  START
// ===============================================================
init();
